<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="./JSC/jscharting.js"></script>
    <script type="text/javascript" src="./JSC/modules/types.js"></script>
    <script type="text/javascript" src="./JSC/modules/toolbar.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>Dashboard</title>
</head>

<body>
    <div class="container">
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-item">
                <label for="to-date">Desde:</label>
                <input type="text" id="startInput" placeholder="Fecha inicial" readonly />
                <div id="startPopup" class="date-popup">
                </div>
            </div>
            <div class="filter-item">

                <label for="to-date">Hasta:</label>
                <input type="text" id="endInput" placeholder="Fecha final" readonly />
                <div id="endPopup" class="date-popup">
                </div>

            </div>
            <div class="filter-item">
                <label for="player">Jugador:</label>
                <select title="jugador" id="selectState">
                    <option>Jugador 1</option>
                    <option>Jugador 2</option>
                </select>
            </div>
            <div class="apply-button">
                <button>Aplicar</button>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <h2>Resumen</h2>
                <div id="radarDiv" class="chart-container">
                </div>
            </div>
            <div class="card">
                <h2>MOT</h2>
                <div id="barsDiv" class="chart-container">
                </div>
            </div>
            <div class="card">
                <h2>Campo Visual</h2>
                <div id="lineDiv" class="chart-container">
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Tiempo de Reacción</h2>
            <div class="chart-container">
                <div id="gauge1Div" class="gauge-container">
                </div>
                <div id="gauge2Div" class="gauge-container">
                </div>
                <div id="gauge3Div" class="gauge-container">
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="./radar.js"></script>
    <script type="text/javascript" src="./bars.js"></script>
    <script type="text/javascript" src="./gauge.js"></script>
    <script type="text/javascript" src="./line.js"></script>
    <script type="text/javascript" src="./datePicker.js"></script>
    <script type="text/javascript" src="./datePopup.js"></script>

</body>

</html>
