<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript" src="./JSC/jscharting.js"></script>
    <script type="text/javascript" src="./JSC/modules/types.js"></script>
    <script type="text/javascript" src="./JSC/modules/toolbar.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <title>Dashboard</title>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <img
          class="header-top-right-img"
          src="https://avtrcon.sharepoint.com/sites/ImagenCorporativa/Logos/logotipos/Avattar/LOGOTIPO%20y%20IMAGOTIPO_Mesa%20de%20trabajo%201.png?referrer=SharePoint&referrerScenario=HighlightedContent-SharePoint&web=1"
          alt="logo-avattar"
          width="150"
        />
        <div class="title-container">
          <div class="logo-container">
            <img alt="logo-client" src="./images/logo-default.png" width="80" />
            <h4>{LOGO}</h4>
          </div>
          <h1>RESULTADOS EJERCICIOS</h1>
        </div>
        <form id="filter-form" class="filter-bar">
          <div class="filter-item-group">
            <div class="filter-item">
              <label for="to-date">Desde:</label>
              <input
                type="text"
                id="startDateInput"
                placeholder="Fecha inicial"
                readonly
              />
              <div id="startDatePopup" class="date-popup"></div>
            </div>
            <div class="filter-item">
              <label for="to-date">Hasta:</label>
              <input
                type="text"
                id="endDateInput"
                placeholder="Fecha final"
                readonly
              />
              <div id="endDatePopup" class="date-popup"></div>
            </div>
            <div class="filter-item">
              <label for="player">Jugador:</label>
              <select title="jugador" id="userSelect"></select>
            </div>
          </div>
          <div class="apply-button">
            <button type="submit">Aplicar</button>
          </div>
        </form>
      </div>

      <div class="content">
        <div class="card">
          <h2>Resumen</h2>
          <div id="radarDiv" class="chart-container"></div>
        </div>
        <div class="card">
          <h2>MOT</h2>
          <!-- <div id="barsDiv" class="chart-container">
                </div> -->
          <div id="rankingDiv" class="chart-container"></div>
        </div>
        <div class="card">
          <h2>Visión Periférica</h2>
          <div id="lineDiv" class="chart-container"></div>
        </div>
      </div>

      <div class="card">
        <h2>Tiempo de Reacción</h2>
        <div class="chart-container">
          <div id="gauge1Div" class="gauge-container"></div>
          <div id="gauge2Div" class="gauge-container"></div>
          <div id="gauge3Div" class="gauge-container"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
